name: CI - Heart Disease Model Training
    
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      n_estimators:   
        description: 'Jumlah estimators Random Forest'
        required: false
        default: '100'
      max_depth:
        description: 'Max depth Random Forest'
        required: false
        default: '10'
                      
env:      
  PYTHON_VERSION: '3.12.7'
  MLFLOW_VERSION: '2.19.0'
        
jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
          
    steps:
      # ─── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
              
      # ─── 2. Setup Python ────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
              
      # ─── 3. Install dependencies ────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip  
          pip install mlflow==${{ env.MLFLOW_VERSION }} \
                      pandas numpy scikit-learn \
                      matplotlib seaborn dagshub
          
      # ─── 4. Prepare dataset ─────────────────────────────────────
      - name: Prepare preprocessed dataset
        run: |
          python -c "
          import numpy as np, pandas as pd, os, pickle
          from sklearn.model_selection import train_test_split
          from sklearn.preprocessing import StandardScaler
          "
